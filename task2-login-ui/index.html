<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Registration - SehwagGanesh</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <i class="fas fa-shield-alt"></i> SehwagGanesh
    </div>
    <ul class="nav-links">
      <li><a href="#login">Login</a></li>
      <li><a href="#register">Register</a></li>
    </ul>
  </nav>

  <!-- Login Section -->
  <section class="login-section" id="login">
    <div class="container">
      <div class="login-card">
        <div class="card-header">
          <h2><i class="fas fa-sign-in-alt"></i> Login</h2>
        </div>
        <form class="login-form" id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" name="email" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" required>
            <small class="form-text">Forgot <a href="#password-reset">password?</a></small>
          </div>
          <button type="submit" class="btn btn-primary full-width">Sign In</button>
        </form>
        <div class="card-footer">
          <p>Don't have an account? <a href="#register" class="link-primary">Register</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Registration Section -->
  <section class="register-section" id="register">
    <div class="container">
      <div class="register-card">
        <div class="card-header">
          <h2><i class="fas fa-user-plus"></i> Register</h2>
        </div>
        <form class="register-form" id="registerForm">
          <div class="form-row">
            <div class="form-group half-width">
              <label for="regFirstName">First Name</label>
              <input type="text" id="regFirstName" name="firstName" required>
            </div>
            <div class="form-group half-width">
              <label for="regLastName">Last Name</label>
              <input type="text" id="regLastName" name="lastName" required>
            </div>
          </div>

          <div class="form-group">
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" name="email" required>
          </div>

          <div class="form-group">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" name="password" required>
            <small class="form-text">Minimum 8 characters</small>
          </div>

          <div class="form-group">
            <label for="regConfirmPassword">Confirm Password</label>
            <input type="password" id="regConfirmPassword" name="confirmPassword" required>
            <small class="form-text">Passwords must match</small>
          </div>

          <div form-row>
            <div class="form-group half-width">
              <label for="regPhone">Phone</label>
              <input type="tel" id="regPhone" name="phone">
            </div>
            <div class="form-group half-width">
              <label for="regRole">Role</label>
              <select id="regRole" name="role">
                <option value="user">Regular User</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </div>

          <div class="form-group terms">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the <a href="#" class="link-primary">Terms of Service</a> and <a href="#" class="link-primary">Privacy Policy</a></label>
          </div>

          <button type="submit" class="btn btn-primary full-width">Create Account</button>
        </form>
        <div class="card-footer">
          <p>Already have an account? <a href="#login" class="link-primary">Login</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Password Toggle Script -->
  <script>
    // Password visibility toggle
    document.querySelectorAll('.form-group input[type="password"]').forEach(input => {
      const formGroup = input.closest('.form-group');
      const toggleBtn = document.createElement('button');
      toggleBtn.type = 'button';
      toggleBtn.className = 'password-toggle';
      toggleBtn.innerHTML = '<i class="fas fa-eye"></i>';
      toggleBtn.style.cssText = `
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #666;
        cursor: pointer;
        font-size: 0.8rem;
        padding: 0;
        z-index: 10;
      `;
      toggleBtn.addEventListener('click', function() {
        const newType = input.type === 'password' ? 'text' : 'password';
        input.type = newType;
        const icon = this.querySelector('i');
        icon.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
      });

      // Position the toggle absolutely within the form-group
      formGroup.style.position = 'relative';
      formGroup.style.paddingRight = '30px';
      formGroup.appendChild(toggleBtn);
    });
  </script>

  <script>
    // Form validation
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      let valid = true;
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;

      // Password match validation
      if (password !== confirmPassword) {
        alert('Passwords do not match');
        valid = false;
      }

      // Password strength check
      if (password.length < 8) {
        alert('Password must be at least 8 characters');
        valid = false;
      }

      if (!valid) {
        e.preventDefault();
      }
    });

    // Login form basic validation
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!email || !password) {
        alert('Please fill in all fields');
        e.preventDefault();
      }
    });

    // Tab switching between login and register
    const loginLink = document.querySelector('.nav-links a[href="#login"]');
    const registerLink = document.querySelector('.nav-links a[href="#register"]');
    const loginSection = document.getElementById('login');
    const registerSection = document.getElementById('register');

    if (loginLink && registerLink && loginSection && registerSection) {
      loginLink.addEventListener('click', function(e) {
        e.preventDefault();
        loginSection.style.display = 'block';
        registerSection.style.display = 'none';
      });

      registerLink.addEventListener('click', function(e) {
        e.preventDefault();
        registerSection.style.display = 'block';
        loginSection.style.display = 'none';
      });

      // Show login by default, hide register
      registerSection.style.display = 'none';
    }
  </script>
</body>
</html>
